name: 試合結果を取り込む

on:
  schedule:
    # 対局は19時開始の2半荘で23時前後に終わるので、23:20 と 0:20 (JST) に取りに行く
    - cron: "20 14 * * *"
    - cron: "20 15 * * *"
  workflow_dispatch: # GitHub の画面/アプリの「Run workflow」で手動実行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 変化があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if ! git diff --cached --quiet; then git commit -m "試合結果を更新"; git push; fi
