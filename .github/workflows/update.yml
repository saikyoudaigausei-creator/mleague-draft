name: 試合結果を取り込む

on:
  schedule:
    # 対局は23時前後に終わる。GitHub の定期実行は混雑時に遅れたり飛ばされたりするので、
    # 23時台〜翌2時台(JST)に30分おき + 朝7時の保険で何度も見に行く(結果が同じなら何もしない)
    - cron: "15,45 14-17 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch: # GitHub の画面/アプリの「Run workflow」で手動実行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 変化があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if ! git diff --cached --quiet; then git commit -m "試合結果を更新"; git push; fi
